name: Build Creator Studio Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app to Android
        run: npx cap sync android
        
     
      - name: Add required media permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = 'android.permission.READ_EXTERNAL_STORAGE'

          content = re.sub(
              r'\s*<uses-permission\s+android:name=["\']android\.permission\.READ_EXTERNAL_STORAGE["\'](?:\s+android:maxSdkVersion=["\']\d+["\'])?\s*/>',
              '',
              content
          )

          match = re.search(r'<manifest\b[^>]*>', content)
          if not match:
              raise RuntimeError("Android manifest tag not found")

          insertion = '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          content = content[:match.end()] + insertion + content[match.end():]
          manifest.write_text(content)
          print("READ_EXTERNAL_STORAGE permission configured for Android API 32 and below.")
          PY

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
